name: Python package CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and test tools
        run: python -m pip install --upgrade build twine pytest pytest-django
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Install built wheel in clean environment
        run: |
          python -m venv /tmp/aad-docs-wheel
          /tmp/aad-docs-wheel/bin/python -m pip install dist/*.whl
          (cd /tmp && /tmp/aad-docs-wheel/bin/python - <<'PY'
          import importlib.resources as r
          import aad_docs
          print(aad_docs.__file__, aad_docs.__version__)
          root = r.files("aad_docs")
          for rel in (
              "static/aad_docs/vendor/mermaid.min.js",
              "static/aad_docs/vendor/plt-design-system.css",
              "templates/aad_docs/base.html",
              "docs/01-overview.md",
          ):
              assert root.joinpath(rel).is_file(), f"missing from the wheel: {rel}"
          PY
          )
      - name: Check the distributions carry the licence
        run: |
          unzip -l dist/*.whl | grep -q "licenses/LICENSE"
          tar tzf dist/*.tar.gz | grep -q "/LICENSE$"
      - name: Install project and run tests
        run: |
          python -m pip install -e ".[dev]"
          python demo/manage.py check
          python -m pytest -q
