name: Python package CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and test tools
        run: python -m pip install --upgrade build twine pytest pytest-django
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Install built wheel in clean environment
        run: |
          python -m venv /tmp/aad-docs-wheel
          /tmp/aad-docs-wheel/bin/python -m pip install dist/*.whl
          (cd /tmp && /tmp/aad-docs-wheel/bin/python -c "import aad_docs; print(aad_docs.__file__)")
      - name: Install project and run tests
        run: |
          python -m pip install -e ".[dev]"
          python demo/manage.py check
          python -m pytest -q
