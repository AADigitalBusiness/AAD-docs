name: Publish to PyPI
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install --upgrade build twine pytest pytest-django
      - name: Confirm tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('aad_docs/_version.py').read_text()
          version = re.search(r'^__version__ = "([^"]+)"$', text, re.MULTILINE).group(1)
          expected = 'v' + version
          assert os.environ['RELEASE_TAG'] == expected, f"Expected {expected}, got {os.environ['RELEASE_TAG']}"
          PY
      - name: Confirm the changelog has a section for this version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: grep -q "^## ${RELEASE_TAG#v} " CHANGELOG.md
      - name: Build and validate
        run: |
          python -m build
          python -m twine check dist/*
      - name: Test application
        run: |
          python -m pip install -e ".[dev]"
          python demo/manage.py check
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aad-docs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Create the GitHub release with the distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v v="$version" '$0 ~ "^## " v " " {p=1; next} /^## / {p=0} p' CHANGELOG.md > notes.md
          flags=""
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then flags="--prerelease"; fi
          gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --notes-file notes.md $flags
