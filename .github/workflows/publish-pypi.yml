name: Publish to PyPI
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install --upgrade build twine pytest pytest-django
      - name: Confirm tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          metadata = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          expected = 'v' + metadata['project']['version']
          assert os.environ['RELEASE_TAG'] == expected, f"Expected {expected}, got {os.environ['RELEASE_TAG']}"
          PY
      - name: Build and validate
        run: |
          python -m build
          python -m twine check dist/*
      - name: Test application
        run: |
          python -m pip install -e ".[dev]"
          python demo/manage.py check
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aad-docs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
