[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aad_docs"
version = "0.1.1"
description = "Django app that turns docs/ folders into navigable, visual documentation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "AADigitalBusiness"}
]
dependencies = [
    "Django>=5.2",
    "markdown-it-py>=3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]
screenshots = [
    "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/AADigitalBusiness/AAD-docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["aad_docs*"]

[tool.setuptools.package-data]
aad_docs = [
    "docs/**/*",
    "docs/*",
    "templates/**/*",
    "static/**/*",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "demo.settings"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
