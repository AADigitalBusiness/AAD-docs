[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aad-docs"
version = "0.1.0"
description = "Django app that turns docs/ folders into navigable documentation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "AADigitalBusiness"}
]
dependencies = [
    "Django>=5.2",
    "markdown-it-py>=4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/AADigitalBusiness/AAD-docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["aad_docs"]

[tool.setuptools.package-data]
aad_docs = [
    "templates/aad_docs/*.html",
    "templates/aad_docs/components/*.html",
    "static/aad_docs/*.css",
    "static/aad_docs/*.js",
    "static/aad_docs/vendor/*.js",
    "static/aad_docs/vendor/*.LICENSE",
]
