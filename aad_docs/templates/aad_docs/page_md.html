{% extends "aad_docs/base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block breadcrumbs %}
<nav class="breadcrumbs" aria-label="Breadcrumb">
    <ol>
        <li><a href="{% url 'aad_docs:index' %}">Documentation</a></li>
        <li><a href="{% url 'aad_docs:node' app_slug=node.slug %}">{{ node.title }}</a></li>
        <li aria-current="page">{{ page.title }}</li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<article class="docs-page page-md">
    <header class="page-header">
        <h1>{{ page.title }}</h1>
    </header>
    
    <section class="page-content">
        {{ page.content|safe }}
    </section>
</article>
{% endblock %}
