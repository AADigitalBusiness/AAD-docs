<div class="plt-cards" data-component="cards">
    {% for item in items %}
    <div class="plt-card d-card theme-elevated" data-component="card">
        <div class="d-card-body">
        <h3 class="plt-card__title d-card-title">
            {% if item.href %}<a href="{{ item.href }}">{{ item.title }}</a>{% else %}{{ item.title }}{% endif %}
        </h3>
        <div class="plt-card__body">{{ item.body|safe }}</div>
        </div>
    </div>
    {% endfor %}
</div>
