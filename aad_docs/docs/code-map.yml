# Design target, written by hand. Not generated yet.
# docs_codemap replaces this file at milestone 2 (see docs/PLAN.md).
app: aad_docs
status: planned

models: []   # aad_docs defines no models: documentation is flat files.

routes:
  - path: /docs/
    name: aad_docs:index
    view: IndexView
    file: aad_docs/views.py
  - path: /docs/<app_slug>/
    name: aad_docs:node
    view: NodeView
    file: aad_docs/views.py
  - path: /docs/<app_slug>/<path:path>/
    name: aad_docs:page
    view: PageView
    file: aad_docs/views.py
    resolves: [section, model, page]
  - path: /docs/<app_slug>/assets/<path:file>
    name: aad_docs:asset
    view: AssetView
    file: aad_docs/views.py

modules:
  - file: aad_docs/__init__.py
    exports: [Node, docs_url]
    does: Imports no Django code. docs_url loads routing on its first call, so a docs/__init__.py can import Node before Django is ready.

  - file: aad_docs/apps.py
    classes:
      - name: AadDocsConfig
        kind: app config
        does: Registers the app and its Django system checks.

  - file: aad_docs/conf.py
    data:
      - name: DEFAULTS
        does: Default value of every setting. Owner of settings.csv.
    functions:
      - name: get_settings
        does: Returns the AAD_DOCS setting merged over its defaults.

  - file: aad_docs/nodes.py
    classes:
      - name: Node
        kind: data
        does: One documentation folder. Holds slug, titles, order, pages, visible and children. Owner of node-options.csv.
        used_by: [build_tree, NodeView, PageView]
      - name: Page
        kind: data
        does: One file inside a node. Holds slug, title, kind, languages, variants, frontmatter and content.
        used_by: [read_page, PageView]

  - file: aad_docs/discovery.py
    functions:
      - name: find_doc_dirs
        does: Walks INSTALLED_APPS and the root folder and returns each docs/ that has an __init__.py.
      - name: resolve_node
        does: Loads a docs package by file path under a unique module name, reads its node attribute and applies defaults. A failure is recorded and the node skipped.
        uses: [Node]
      - name: build_tree
        does: Builds and caches the full node tree.
        uses: [find_doc_dirs, resolve_node]

  - file: aad_docs/readers/__init__.py
    data:
      - name: READERS
        does: Registry of extensions and their readers. Owner of file-types.csv.
    functions:
      - name: read_page
        does: Picks the reader for a file extension and returns a Page.
        uses: [pick_variant]
  - file: aad_docs/readers/markdown.py
    functions:
      - name: read
        does: Renders a .md to HTML, keeping Mermaid blocks for the browser.
  - file: aad_docs/readers/mdx.py
    data:
      - name: MDX_TAGS
        does: Closed registry of tags with their form, attributes, allowed parent and template. Owner of mdx-tags.csv.
    functions:
      - name: read
        does: Renders the Markdown of a .mdx with raw HTML disabled and replaces each known tag, outside code, with its component, either a tag on one line or a container whose body is rendered as Markdown.
  - file: aad_docs/readers/yaml.py
    functions:
      - name: read
        does: Parses a .yml into data for the explorer.
  - file: aad_docs/readers/csv.py
    functions:
      - name: read
        does: Parses a .csv into columns and rows for the table.
  - file: aad_docs/readers/json.py
    functions:
      - name: read
        does: Parses a .json and validates its type for the simulator or viewer.

  - file: aad_docs/language.py
    functions:
      - name: pick_variant
        does: Normalizes the active language against LANGUAGES and returns that variant of a page, else the one of the first language.

  - file: aad_docs/routing.py
    functions:
      - name: resolve_path
        does: Turns the path after the app slug into a section, a model or a page. Rejects a path that leaves the node folder. The section wins over a model with the same slug.
        uses: [build_tree]
      - name: docs_url
        does: Returns the address of an app, a model or one of their pages.

  - file: aad_docs/urls.py
    does: URL patterns under the aad_docs namespace.

  - file: aad_docs/views.py
    classes:
      - name: IndexView
        kind: view
        does: Shows the root node and the list of app nodes.
      - name: NodeView
        kind: view
        does: Shows one node with its pages and children.
        uses: [build_tree]
      - name: PageView
        kind: view
        does: Shows one page or one model in the active language.
        uses: [resolve_path, read_page]
      - name: AssetView
        kind: view
        does: Serves an image of a closed list of types, SVG excluded, from a node's assets folder.
      - name: DocsAccessMixin
        kind: mixin
        does: Applies the ACCESS setting to every view.

  - file: aad_docs/codemap/models.py
    functions:
      - name: describe_models
        does: Reads _meta, field options and docstrings of an app's models.
  - file: aad_docs/codemap/routes.py
    functions:
      - name: describe_routes
        does: Reads the URL resolver and maps each route to its view and file.
  - file: aad_docs/codemap/classes.py
    functions:
      - name: describe_classes
        does: Lists views, and classes under services/, with their docstrings.
  - file: aad_docs/codemap/writer.py
    functions:
      - name: write_codemap
        does: Writes code-map.yml and, from M3, the reference tables through the generated-file guard.
        uses: [GeneratedManifest]

  - file: aad_docs/generated.py
    classes:
      - name: GeneratedManifest
        kind: service
        does: Tracks the hash of each generated file and refuses to overwrite one edited by hand. Replaces once a file of the initial design-target set that has no entry.

  - file: aad_docs/checks.py
    data:
      - name: CHECKS
        does: Registry of the rules D001 to D064. Owner of checks.csv.
    functions:
      - name: run_checks
        does: Runs every docs_check rule and returns the findings.

  - file: aad_docs/management/commands/docs_codemap.py
    commands: [docs_codemap]
  - file: aad_docs/management/commands/docs_check.py
    commands: [docs_check]
  - file: aad_docs/management/commands/docs_screenshots.py
    commands: [docs_screenshots]

templates:
  - aad_docs/templates/aad_docs/base.html
  - aad_docs/templates/aad_docs/node.html
  - aad_docs/templates/aad_docs/page_md.html
  - aad_docs/templates/aad_docs/page_model.html
  - aad_docs/templates/aad_docs/page_explorer.html
  - aad_docs/templates/aad_docs/page_table.html
  - aad_docs/templates/aad_docs/page_simulator.html
  - aad_docs/templates/aad_docs/components/   # callout, steps, tabs, cards, details

static:
  - aad_docs/static/aad_docs/docs.css
  - aad_docs/static/aad_docs/explorer.js
  - aad_docs/static/aad_docs/table.js
  - aad_docs/static/aad_docs/simulator.js
  - aad_docs/static/aad_docs/tabs.js
  - aad_docs/static/aad_docs/vendor/mermaid.min.js
  - aad_docs/static/aad_docs/vendor/mermaid.LICENSE
